services:
  - type: web
    name: lms-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://vivekcyr25.github.io"
      - key: CORS_ORIGIN
        value: "https://vivekcyr25.github.io"
      - key: FIREBASE_PROJECT_ID
        value: "lms-aurora-glass"
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: "./firebase-service-account.json"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: lms-db
    databaseName: lms_db
    user: lms_user
    plan: free
