name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://lms-backend-u33g.onrender.com/api/v1
          VITE_SYNCFUSION_LICENSE: Ngo9BigBOggjGyl/VkV+Xk9HfV5AQmBIYVp/TGpJfl96cVxMZVVBJAtUQF1hT35Wdk1iXn1YcXxXRmZdWkd1
          VITE_FIREBASE_USE_MOCK: "false"
          VITE_FIREBASE_API_KEY: AIzaSyAdZqINOAWB2m9XR_UuptYTLTTmnECTR5Y
          VITE_FIREBASE_AUTH_DOMAIN: lms-aurora-glass.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: lms-aurora-glass
          VITE_FIREBASE_APP_ID: "1:762732987774:web:bf8b607dd0a6b020545f2f"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "762732987774"
          VITE_FIREBASE_STORAGE_BUCKET: lms-aurora-glass.firebasestorage.app

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
